name: Build and Publish Docker Container

# Images are pushed only for a published release (tag vX.Y.Z). Pushes to main and
# manual runs build the image to verify the Dockerfile and never push or tag it.
on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'docker-entrypoint.sh'
      - 'docker-compose.yml'
      - 'src/**'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build Ubuntu 24.04 Container with Intel Drivers
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      IS_RELEASE: ${{ github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check release tag matches VERSION
        if: ${{ env.IS_RELEASE == 'true' }}
        run: |
          test "$GITHUB_REF_NAME" = "v$(tr -d '[:space:]' < VERSION)" || {
            echo "Tag $GITHUB_REF_NAME does not match VERSION $(cat VERSION)"; exit 1; }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ env.IS_RELEASE == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ env.IS_RELEASE == 'true' && !contains(github.ref_name, '-') }}
            type=sha,format=short

      - name: Build container image (push only for a release tag)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ env.IS_RELEASE == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
