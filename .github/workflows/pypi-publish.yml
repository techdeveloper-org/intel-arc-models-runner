name: Publish PyPI Distribution Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run verification only (do not upload)'
        required: true
        default: 'false'
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    name: Build Wheel and Publish to PyPI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build and verify standalone distribution
        run: |
          python scripts/build_wheel.py

      - name: Validate distribution metadata with Twine
        run: |
          python scripts/publish_pypi.py --dry-run

      - name: Publish package distributions to PyPI
        if: ${{ github.event_name == 'release' && !inputs.dry_run }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
