name: Publish PyPI Distribution Package

# Upload happens only for a published GitHub release whose tag equals vVERSION,
# after the test suite passed, and only after a reviewer approves the `pypi`
# environment. Branch pushes and manual runs never upload.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Tests and tag check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Check tag matches VERSION (release events only)
        if: ${{ github.event_name == 'release' }}
        run: |
          test "$GITHUB_REF_NAME" = "v$(tr -d '[:space:]' < VERSION)" || {
            echo "Tag $GITHUB_REF_NAME does not match VERSION $(cat VERSION)"; exit 1; }

      - name: Check version files and docs
        run: |
          python -m pip install --upgrade pip
          python scripts/check_docs_sync.py

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Run tests (hardware tests excluded)
        run: python -m pytest -m "not hardware" -q

  build:
    name: Build wheel and sdist
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build and verify standalone distribution
        run: python scripts/build_wheel.py

      - name: Validate distribution metadata with Twine
        run: python scripts/publish_pypi.py --dry-run

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI (needs approval)
    needs: build
    if: ${{ github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/arc-runner/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
