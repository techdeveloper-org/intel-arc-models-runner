[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arc-runner"
version = "0.2.0"
description = "High-performance local model runner optimized specifically for Intel Arc GPUs and AI Boost NPUs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "techdeveloper-org", email = "info@techdeveloper.org" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
keywords = [
    "intel-arc",
    "openvino",
    "npu",
    "llm-runner",
    "sycl",
    "level-zero",
    "speculative-decoding",
    "local-ai",
    "ollama-alternative",
    "intel-core-ultra",
    "fastapi",
    "xmx"
]
dependencies = [
    "openvino>=2026.1.0",
    "openvino-genai>=2026.0.0.0",
    "openvino-tokenizers>=2026.0.0.0",
    "pydantic>=2.5.0",
    "rich>=13.7.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "httpx>=0.27.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "opencv-python-headless>=4.9.0"
]

[project.urls]
Homepage = "https://github.com/techdeveloper-org/intel-arc-models-runner"
Documentation = "https://github.com/techdeveloper-org/intel-arc-models-runner#readme"
Repository = "https://github.com/techdeveloper-org/intel-arc-models-runner.git"
Issues = "https://github.com/techdeveloper-org/intel-arc-models-runner/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "build>=1.0.0",
    "twine>=5.0.0"
]

[project.scripts]
arc-runner = "arc_runner.cli.main:main"
intel-arc-models-runner = "arc_runner.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"arc_runner" = ["py.typed"]
"arc_runner.server" = ["templates/*.html", "static/css/*.css", "static/js/*.js"]
"arc_runner.native" = ["*.c", "*.h", "*.dll", "*.so", "*.build.json"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "hardware: integration tests requiring real Intel silicon (Arc GPU, AI Boost NPU, or Core Ultra CPU)",
]
